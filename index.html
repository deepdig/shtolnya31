<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>3D Симулятор</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: sans-serif; }
        #info { position: absolute; top: 10px; width: 100%; text-align: center; color: white; text-shadow: 1px 1px 3px black; pointer-events: none; }
        #heading { font-size: 15px; margin-top: 2px; opacity: 0.9; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: white; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; transition: width 0.1s, height 0.1s; }
        #blocker { position: absolute; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 10; }
        #instructions { color: white; text-align: center; background: rgba(0,0,0,0.7); padding: 20px; border-radius: 10px; }
        #hint { position: absolute; top: 55%; left: 50%; transform: translateX(-50%); color: #ffff66; text-shadow: 1px 1px 4px black; font-weight: bold; font-size: 18px; pointer-events: none; display: none; white-space: nowrap; }
        #summitNotification { position: absolute; top: 28%; left: 50%; transform: translate(-50%, -50%) scale(0.9); color: #fff; background: rgba(0,0,0,0.78); padding: 22px 46px; border-radius: 14px; border: 2px solid #ffd700; font-size: 28px; font-weight: bold; text-shadow: 2px 2px 6px black; box-shadow: 0 0 30px rgba(255, 215, 0, 0.55); white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.8s ease, transform 0.8s ease; z-index: 100; }
        #summitNotification.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        #loading { position: absolute; top: 10%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 24px; z-index: 20; }
        #renderPanel { position: absolute; left: 16px; bottom: 16px; z-index: 30; width: 230px; padding: 12px 14px; border-radius: 10px; background: rgba(18,24,22,0.72); color: #eef2f0; font-size: 12px; line-height: 1.45; backdrop-filter: blur(6px); user-select: none; -webkit-user-select: none; }
        #renderPanel .rp-row { display: block; margin: 0 0 8px 0; }
        #renderPanel .rp-row:last-child { margin-bottom: 0; }
        #renderPanel .rp-label { display: flex; justify-content: space-between; margin-bottom: 3px; color: #cfd8d4; }
        #renderPanel input[type="range"] { width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div id="loading">Загрузка карты...</div>
    <div id="blocker">
        <div id="instructions">
            <h2>Бештау.</h2>
            <p>Нажмите, чтобы начать</p>
            <p>W, A, S, D - движение<br>Shift - бег<br>Space - прыжок<br>Мышь - осмотр</p>
        </div>
    </div>
    <div id="info">
        <div>Высота: <span id="altitude">0</span> м</div>
        <div id="heading">Направление: <span id="headingDir">N</span></div>
    </div>
    <div id="renderPanel">
        <label class="rp-row">
            <span class="rp-label">Плотность тумана <span id="fogDensityVal">0.003</span></span>
            <input id="fogDensityRange" type="range" min="0.00002" max="0.01" step="0.00001" value="0.003">
        </label>
        <label class="rp-row">
            <span class="rp-label">Яркость неба <span id="skyLightVal">1.00</span></span>
            <input id="skyLightRange" type="range" min="0.4" max="2.0" step="0.05" value="1.0">
        </label>
    </div>
    <div id="crosshair"></div>
    <div id="hint">Нажмите, чтобы войти в штольню</div>
    <div id="summitNotification">Вы достигли вершины горы</div>

    <!-- Локальные библиотеки three.js r187 (глобальная сборка, работает по file://) -->
    <script src="data/threejs/187/build/three.global.js"></script>
    <script src="data/threejs/187/examples/js/PointerLockControls.js"></script>
    
    <!-- Загрузка объектов карты -->
    <script src="data/maps/map_objects.js"></script>
    <script src="data/maps/forest_data.js"></script>
    <script src="data/maps/heightmap_data.js"></script>

<script>
// ============================================================
// 0. НАСТРОЙКИ МИРА (из heightmap_data.js)
// ============================================================
const worldSettings = window.HEIGHTMAP_SETTINGS || {
    worldSizeKm: 9,
    minHeightM: 0,
    maxHeightM: 1400,
    fogMinM: 800,
    fogMaxM: 1600,
    fogDensity: 0.75
};

const TERRAIN_SIZE_M  = worldSettings.worldSizeKm * 1000;
const MIN_HEIGHT_M    = worldSettings.minHeightM;
const MAX_HEIGHT_M    = worldSettings.maxHeightM;
const HEIGHT_RANGE_M  = MAX_HEIGHT_M - MIN_HEIGHT_M;
const HALF_WORLD_M    = TERRAIN_SIZE_M / 2;

// Параметры тумана (из редактора)
const FOG_MIN_M  = worldSettings.fogMinM  ?? 800;
const FOG_MAX_M  = worldSettings.fogMaxM  ?? 1600;
const FOG_DENSITY = worldSettings.fogDensity ?? 0.75;

console.log(`[Мир] ${worldSettings.worldSizeKm} км × ${worldSettings.worldSizeKm} км`);
console.log(`[Высоты] ${MIN_HEIGHT_M}–${MAX_HEIGHT_M} м`);
console.log(`[Туман] ${FOG_MIN_M}–${FOG_MAX_M} м, плотность ${FOG_DENSITY}`);

// ============================================================
// 1. СЦЕНА И РЕНДЕР
// ============================================================
const scene = new THREE.Scene();
const fogColor = 0xC2CDD0;
scene.background = new THREE.Color(fogColor);
// Экспоненциальный туман как в образце (мягкая дымка, сгущается с расстоянием).
// Плотность подобрана под карту 9×9 км: середина завесы ~4 км, дальние хребты ещё читаются.
const FOG_EXP_DENSITY = 0.003; // 0.00016
scene.fog = new THREE.FogExp2(fogColor, FOG_EXP_DENSITY);

// Низовой туман: экспоненциальная дымка — только ниже FOG_TOP_M,
// к границе плавно сходит на нет, выше 700 м её нет вовсе.
const FOG_TOP_M      = 800; // м — потолок низового экспоненциального тумана
const FOG_TOP_FADE_M = 150; // м — плавное затухание перед границей (550…700 м)
const FOG_TOP_FROM_GLSL = (FOG_TOP_M - FOG_TOP_FADE_M).toFixed(1);
const FOG_TOP_TO_GLSL   = FOG_TOP_M.toFixed(1);

// three.js красит fog прямо в шейдере каждого материала и не знает высоту фрагмента,
// поэтому подменяем фог-чанки: в вершинный добавляем мировую высоту вершины,
// во фрагментный — затухание фактора тумана к границе. Один раз, до компиляции материалов.
THREE.ShaderChunk.fog_pars_vertex = `
#ifdef USE_FOG
	varying float vFogDepth;
	varying float vFogWorldY;
#endif`;

THREE.ShaderChunk.fog_vertex = `
#ifdef USE_FOG
	vFogDepth = - mvPosition.z;
	// viewMatrix — это поворот, поэтому мировая высота = высота камеры плюс
	// проекция сдвига от камеры на его второй столбец (обратное преобразование без inverse()).
	vFogWorldY = cameraPosition.y + dot( mvPosition.xyz, viewMatrix[ 1 ].xyz );
#endif`;

THREE.ShaderChunk.fog_pars_fragment = `
#ifdef USE_FOG
	uniform vec3 fogColor;
	varying float vFogDepth;
	varying float vFogWorldY;
	#ifdef FOG_EXP2
		uniform float fogDensity;
	#else
		uniform float fogNear;
		uniform float fogFar;
	#endif
#endif`;

THREE.ShaderChunk.fog_fragment = `
#ifdef USE_FOG
	#ifdef FOG_EXP2
		float fogFactor = 1.0 - exp( - fogDensity * fogDensity * vFogDepth * vFogDepth );
	#else
		float fogFactor = smoothstep( fogNear, fogFar, vFogDepth );
	#endif
	#ifdef FOG_EXP2
		// Низовой туман: ниже ${FOG_TOP_FROM_GLSL} м — целиком, к ${FOG_TOP_TO_GLSL} м гаснет, выше — его нет.
		fogFactor *= 1.0 - smoothstep( ${FOG_TOP_FROM_GLSL}, ${FOG_TOP_TO_GLSL}, vFogWorldY );
	#endif
	gl_FragColor.rgb = mix( gl_FragColor.rgb, fogColor, fogFactor );
#endif`;

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.35,
    TERRAIN_SIZE_M * 2.5
);

const groundRaycaster = new THREE.Raycaster();
const downDir = new THREE.Vector3(0, -1, 0);
const rayOrigin = new THREE.Vector3();
let walkableMeshes = null;

// Функция для точного определения высоты визуальной сетки ландшафта по её треугольникам
function getVisualTerrainHeight(x, z) {
    if (!terrainMesh || !terrainMesh.geometry) return MIN_HEIGHT_M;
    const geometry = terrainMesh.geometry;
    const pos = geometry.attributes.position;
    
    const u = (x / TERRAIN_SIZE_M) + 0.5;
    const v = (z / TERRAIN_SIZE_M) + 0.5;
    if (u < 0 || u > 1 || v < 0 || v > 1) return MIN_HEIGHT_M;

    const gridX = u * (SEGMENTS - 1);
    const gridZ = v * (SEGMENTS - 1);

    const x0 = Math.floor(gridX);
    const z0 = Math.floor(gridZ);
    const x1 = Math.min(SEGMENTS - 1, x0 + 1);
    const z1 = Math.min(SEGMENTS - 1, z0 + 1);

    const tx = gridX - x0;
    const tz = gridZ - z0;

    // Индексы вершин в PlaneGeometry
    const i00 = z0 * SEGMENTS + x0;
    const i10 = z0 * SEGMENTS + x1;
    const i01 = z1 * SEGMENTS + x0;
    const i11 = z1 * SEGMENTS + x1;

    const y00 = pos.getY(i00);
    const y10 = pos.getY(i10);
    const y01 = pos.getY(i01);
    const y11 = pos.getY(i11);

    // Интерполяция по треугольникам (диагональ проходит от (x0,z1) к (x1,z0))
    if (tx + tz <= 1) {
        return y00 + (y10 - y00) * tx + (y01 - y00) * tz;
    } else {
        return y11 + (y01 - y11) * (1 - tx) + (y10 - y11) * (1 - tz);
    }
}

function keepCameraAboveGround(eyeHeight = 1.8) {
    const cx = camera.position.x;
    const cz = camera.position.z;
    const R = 1.6;

    // Берем максимальную высоту из математической и визуальной
    let maxGroundY = Math.max(
        getActualTerrainHeight(cx, cz),
        getVisualTerrainHeight(cx, cz)
    );

    // Проверяем 8 точек по окружности вокруг головы игрока
    for (let i = 0; i < 8; i++) {
        const angle = (i * Math.PI) / 4;
        const px = cx + Math.cos(angle) * R;
        const pz = cz + Math.sin(angle) * R;
        
        const py = Math.max(
            getActualTerrainHeight(px, pz),
            getVisualTerrainHeight(px, pz)
        );

        if (py > maxGroundY) {
            maxGroundY = py;
        }
    }

    // Не даём камере опуститься ниже самого высокого края склона рядом с игроком
    const minAllowedY = maxGroundY + eyeHeight;
    if (camera.position.y < minAllowedY) {
        camera.position.y = minAllowedY;
    }
}

// Возвращает множитель скорости от 0.25 (очень крутой подъём) до 1.0 (ровно или спуск)
function getSlopeSpeedMultiplier(moveDirX, moveDirZ) {
    const len = Math.hypot(moveDirX, moveDirZ);
    if (len < 1e-5) return 1.0;

    const nx = moveDirX / len;
    const nz = moveDirZ / len;

    const currentY = getActualTerrainHeight(camera.position.x, camera.position.z);
    const aheadY   = getActualTerrainHeight(camera.position.x + nx, camera.position.z + nz);

    const slope = aheadY - currentY;
    // Защита: если высота не определилась или это спуск — скорость 100%
    if (!Number.isFinite(slope) || slope <= 0.05) return 1.0;

    const multiplier = 1.0 / (1.0 + slope * 2.1);
    return Math.max(0.25, multiplier);
}


const renderer = new THREE.WebGLRenderer({ antialias: true });
// Рендер в разрешении устройства (до 2x): без этого кадр на HiDPI растягивался
// из CSS-пикселей и выглядел мягким.
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
// Тонмаппинг из образца. Экспозиция выше 1.0 компенсирует сжатие полутонов ACES,
// чтобы карта не потемнела относительно прежнего вида.
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

// Свет — настроение образца: холодный свет неба и тёплый отражённый от земли
const hemiLight = new THREE.HemisphereLight(0xdbe6ea, 0x3b2d22, 1.0);
scene.add(hemiLight);

const dirLight = new THREE.DirectionalLight(0xfff0d8, 0.85);
dirLight.position.set(TERRAIN_SIZE_M * 0.3, MAX_HEIGHT_M * 2, TERRAIN_SIZE_M * 0.15);
dirLight.castShadow = true;
const shadowRange = TERRAIN_SIZE_M * 0.5;
dirLight.shadow.camera.left   = -shadowRange;
dirLight.shadow.camera.right  =  shadowRange;
dirLight.shadow.camera.top    =  shadowRange;
dirLight.shadow.camera.bottom = -shadowRange;
dirLight.shadow.camera.near   = 1;
dirLight.shadow.camera.far    = MAX_HEIGHT_M * 4;
dirLight.shadow.mapSize.width  = 2048;
dirLight.shadow.mapSize.height = 2048;
// Область тени 9 км на карту 2048 — это ~4.4 м на тексель: без смещения
// рельеф затеняет сам себя треугольными полосами (shadow acne).
dirLight.shadow.bias = -0.0008;
dirLight.shadow.normalBias = 2.0;
scene.add(dirLight);

// ============================================================
// 2. ЛАНДШАФТ ИЗ КАРТЫ ВЫСОТ
// ============================================================
const SEGMENTS = 512;
let terrainHeightData = null;
let terrainMesh = null;

function getActualTerrainHeight(x, z) {
    if (!terrainHeightData) return MIN_HEIGHT_M;

    const u = Math.max(0, Math.min(1, (x / TERRAIN_SIZE_M) + 0.5));
    const v = Math.max(0, Math.min(1, (z / TERRAIN_SIZE_M) + 0.5));

    const px = u * (SEGMENTS - 1);
    const py = v * (SEGMENTS - 1);

    const x0 = Math.floor(px);
    const x1 = Math.min(SEGMENTS - 1, x0 + 1);
    const y0 = Math.floor(py);
    const y1 = Math.min(SEGMENTS - 1, y0 + 1);
    const tx = px - x0;
    const ty = py - y0;

    const getPixel = (cx, cy) => {
        const idx = (cy * SEGMENTS + cx) * 4;
        return terrainHeightData[idx];
    };

    const h00 = getPixel(x0, y0), h10 = getPixel(x1, y0);
    const h01 = getPixel(x0, y1), h11 = getPixel(x1, y1);

    const top    = h00 * (1 - tx) + h10 * tx;
    const bottom = h01 * (1 - tx) + h11 * tx;
    const pixelValue = top * (1 - ty) + bottom * ty;

    return MIN_HEIGHT_M + (pixelValue / 255) * HEIGHT_RANGE_M;
}

function loadHeightmap() {
    const img = new Image();

    if (window.HEIGHTMAP_SRC && typeof window.HEIGHTMAP_SRC === 'string') {
        console.log('[Heightmap] Загрузка из heightmap_data.js');
        img.src = window.HEIGHTMAP_SRC;
    } else {
        console.warn('[Heightmap] HEIGHTMAP_SRC не найден — плоская карта');
        img.onerror = handleHeightmapError;
        img.src = 'heightmap.png';
        return;
    }

    img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = SEGMENTS;
        canvas.height = SEGMENTS;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, SEGMENTS, SEGMENTS);

        try {
            terrainHeightData = ctx.getImageData(0, 0, SEGMENTS, SEGMENTS).data;
            buildTerrain();
            loadMapObjects();
        } catch (e) {
            console.error('Не удалось прочитать heightmap:', e);
            handleHeightmapError();
        }
    };
    img.onerror = handleHeightmapError;
}

function handleHeightmapError() {
    console.warn('[Heightmap] Файл не найден — создаём плоскую карту');
    terrainHeightData = new Uint8ClampedArray(SEGMENTS * SEGMENTS * 4);
    for (let i = 0; i < SEGMENTS * SEGMENTS; i++) {
        terrainHeightData[i * 4]     = 128;
        terrainHeightData[i * 4 + 1] = 128;
        terrainHeightData[i * 4 + 2] = 128;
        terrainHeightData[i * 4 + 3] = 255;
    }
    buildTerrain();
    loadMapObjects();
}

function buildTerrain() {
    const geometry = new THREE.PlaneGeometry(
        TERRAIN_SIZE_M, TERRAIN_SIZE_M,
        SEGMENTS - 1, SEGMENTS - 1
    );
    geometry.rotateX(-Math.PI / 2);

    const positionAttribute = geometry.attributes.position;
    const vertex = new THREE.Vector3();
    const colors = [];
    const color = new THREE.Color();

    for (let i = 0; i < positionAttribute.count; i++) {
        vertex.fromBufferAttribute(positionAttribute, i);
        const h = getActualTerrainHeight(vertex.x, vertex.z);
        positionAttribute.setY(i, h);

        const t = (h - MIN_HEIGHT_M) / HEIGHT_RANGE_M;
        if      (t < 0.30) color.setHex(0x5A6345);
        else if (t < 0.70) color.setHex(0x2E4A21);
        else if (t < 0.90) color.setHex(0x7A7568);
        else               color.setHex(0xA8A8A8);

        colors.push(color.r, color.g, color.b);
    }

    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    geometry.computeVertexNormals();

    const terrainMaterial = new THREE.MeshStandardMaterial({
        vertexColors: true,
        map: groundDetailTex,
        roughness: 0.9,
        // Гладкие нормали (computeVertexNormals выше) вместо граней на каждый треугольник
        flatShading: false,
        side: THREE.DoubleSide
    });

    terrainMesh = new THREE.Mesh(geometry, terrainMaterial);
    terrainMesh.receiveShadow = true;
    terrainMesh.castShadow = true;
    scene.add(terrainMesh);

    applyHeightFog(terrainMaterial);
}

// ============================================================
// 3. ТЕКСТУРЫ И МАТЕРИАЛЫ
// ============================================================
function createCanvasTexture(drawCallback, w = 256, h = 256) {
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    drawCallback(ctx, w, h);
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    return texture;
}

const radiationTex = createCanvasTexture((ctx, w, h) => {
    ctx.fillStyle = '#FFC107'; ctx.fillRect(0, 0, w, h);
    ctx.lineWidth = 12; ctx.strokeStyle = '#000'; ctx.strokeRect(10, 10, w - 20, h - 20);
    const cx = w / 2, cy = h / 2 + 10;
    ctx.beginPath(); ctx.arc(cx, cy, 18, 0, Math.PI * 2); ctx.fillStyle = '#000'; ctx.fill();
    for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        const angle = i * (Math.PI * 2 / 3) - Math.PI / 2;
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, 60, angle - Math.PI / 6, angle + Math.PI / 6);
        ctx.closePath(); ctx.fill();
    }
});

function createSignTexture(text) {
    return createCanvasTexture((ctx, w, h) => {
        ctx.fillStyle = '#c8c8c8'; ctx.fillRect(0, 0, w, h);
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, 'rgba(255,255,255,0.35)');
        grad.addColorStop(0.5, 'rgba(255,255,255,0.0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.15)');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        let fontSize = 45;
        ctx.font = `bold ${fontSize}px Arial`;
        while (fontSize > 18 && ctx.measureText(text).width > w - 40) {
            fontSize -= 2;
            ctx.font = `bold ${fontSize}px Arial`;
        }
        ctx.fillStyle = '#1a1a1a';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(text, w / 2, h / 2);
    }, 512, 128);
}

const concreteTex = createCanvasTexture((ctx, w, h) => {
    ctx.fillStyle = '#8a8378'; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 4000; i++) {
        const a = Math.random() * 0.25;
        ctx.fillStyle = Math.random() > 0.5 ? `rgba(0,0,0,${a})` : `rgba(255,255,255,${a})`;
        ctx.fillRect(Math.random() * w, Math.random() * h, Math.random() * 3 + 1, Math.random() * 3 + 1);
    }
    ctx.strokeStyle = 'rgba(40,35,30,0.4)'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 15; i++) {
        ctx.beginPath();
        let x = Math.random() * w, y = Math.random() * h;
        ctx.moveTo(x, y);
        for (let j = 0; j < 4; j++) {
            x += (Math.random() - 0.5) * 60;
            y += (Math.random() - 0.5) * 60;
            ctx.lineTo(x, y);
        }
        ctx.stroke();
    }
}, 256, 256);

const concreteMat     = new THREE.MeshStandardMaterial({ map: concreteTex, bumpMap: concreteTex, bumpScale: 0.1, roughness: 0.9, flatShading: true, emissive: new THREE.Color(0x222222), emissiveIntensity: 1.0 });
const darkInteriorMat = new THREE.MeshBasicMaterial({ color: 0x4a4a4a });
const rustyDoorMat    = new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.8, metalness: 0.6 });
// Кора бука — процедурная текстура (порт из temp/forest.html)
function createBarkTexture() {
    const c = document.createElement('canvas');
    c.width = 256;
    c.height = 512;
    const ctx = c.getContext('2d');

    ctx.fillStyle = '#686b68';
    ctx.fillRect(0, 0, 256, 512);

    for (let i = 0; i < 2500; i++) {
        const shade = 75 + ((Math.random() * 45) | 0);
        const greenTint = Math.random() > 0.75 ? 12 : 0;
        ctx.fillStyle = `rgb(${shade}, ${shade + greenTint}, ${shade - 2})`;
        ctx.fillRect(
            Math.random() * 256,
            Math.random() * 512,
            6 + Math.random() * 24,
            1 + Math.random() * 3
        );
    }

    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(2, 6);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
}

// Грунт: процедурная микродеталь для рельефа (порт createGroundTexture из temp/forest.html).
// Текстура почти белая: материал умножает её на vertex colors, поэтому цветовые
// зоны высот остаются, а поверхность перестаёт быть однотонной на больших гранях.
function createGroundDetailTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    const ctx = c.getContext('2d');

    ctx.fillStyle = '#f0eee8';
    ctx.fillRect(0, 0, 512, 512);

    const shades = ['#d8d4cb', '#e3e0d8', '#faf8f3', '#cbc7be', '#e8e5de', '#f4f2ec'];
    for (let i = 0; i < 14000; i++) {
        ctx.fillStyle = shades[(Math.random() * shades.length) | 0];
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const w = 2 + Math.random() * 5;
        const h = 1.5 + Math.random() * 3.5;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(Math.random() * Math.PI);
        ctx.fillRect(-w / 2, -h / 2, w, h);
        ctx.restore();
    }

    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    // 9000 м / 1200 ≈ 7.5 м на плитку — деталь ~1.5 см на тексель, как у forest
    tex.repeat.set(1200, 1200);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
}

//===== Дерево «бук» (порт createBeechTree из temp/forest.html) =========
// Инстансы требуют единую сетку на дерево, поэтому части сливаем заранее
// Доля кроны ровно как в temp/forest.html: IcosahedronGeometry(1, 1)
// со сферическими (гладкими) нормалями, сжатая в «линзу» (1.3, 0.65, 1.3)r.
// Там r = 1.8 * масштаб дерева при высоте 15–22 * масштаб, то есть r ≈ 0.0973·h.
const FOLIAGE_DETAIL = 1;
const FOLIAGE_RADIUS_OF_HEIGHT = 1.8 / 18.5;
const FOLIAGE_SQUASH_XZ = 1.3;
const FOLIAGE_SQUASH_Y  = 0.65;

function createFoliageLobe(radius, rand, cx, cy, cz) {
    const geo = new THREE.IcosahedronGeometry(1, FOLIAGE_DETAIL);
    geo.scale(radius * FOLIAGE_SQUASH_XZ, radius * FOLIAGE_SQUASH_Y, radius * FOLIAGE_SQUASH_XZ);
    geo.rotateY(rand() * Math.PI * 2);
    geo.translate(cx, cy, cz);
    return geo;
}

// Слияние частей дерева в одну сетку. Нормали берём готовые: у листвы это
// сферические нормали икосаэдра (как в temp/forest.html), у ствола — свои
// после сужения; пересчёт по сетке снова сделал бы крону гранёной.
function mergeTreeParts(parts) {
    const positions = [];
    const normals = [];
    const colors = [];
    const uvs = [];
    const index = [];
    let hasNormal = true;
    let hasColor = true;
    let hasUv = true;

    for (const geo of parts) {
        const pos = geo.attributes.position;
        const offset = positions.length / 3;
        for (let i = 0; i < pos.count; i++) {
            positions.push(pos.getX(i), pos.getY(i), pos.getZ(i));
        }

        const nrm = geo.attributes.normal;
        if (nrm) {
            for (let i = 0; i < nrm.count; i++) normals.push(nrm.getX(i), nrm.getY(i), nrm.getZ(i));
        } else {
            hasNormal = false;
        }

        const col = geo.attributes.color;
        if (col) {
            for (let i = 0; i < col.count; i++) colors.push(col.getX(i), col.getY(i), col.getZ(i));
        } else {
            hasColor = false;
        }

        const uv = geo.attributes.uv;
        if (uv) {
            for (let i = 0; i < uv.count; i++) uvs.push(uv.getX(i), uv.getY(i));
        } else {
            hasUv = false;
        }

        if (geo.index) {
            const src = geo.index.array;
            for (let i = 0; i < src.length; i++) index.push(src[i] + offset);
        } else {
            for (let i = 0; i < pos.count; i++) index.push(offset + i);
        }
    }

    const merged = new THREE.BufferGeometry();
    merged.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    if (hasColor && colors.length) {
        merged.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    }
    if (hasUv && uvs.length) {
        merged.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    }
    merged.setIndex(index);
    if (hasNormal) {
        merged.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
    } else {
        merged.computeVertexNormals();
    }
    return merged;
}

// Один вариант бука: ствол с изгибом и расширением у корней, ветви, шапки листвы
function createBeechVariant(rand, cfg) {
    const height = cfg.heightMin + rand() * (cfg.heightMax - cfg.heightMin);
    const baseRadius = (0.32 + rand() * 0.22) * cfg.radiusScale;

    const points = [];
    const segments = 6;
    const leanX = (rand() - 0.5) * 1.8;
    const leanZ = (rand() - 0.5) * 1.8;

    for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        points.push(new THREE.Vector3(
            Math.sin(t * Math.PI * 1.4) * 0.45 + leanX * t,
            t * height,
            Math.cos(t * Math.PI * 1.1) * 0.35 + leanZ * t
        ));
    }

    const curve = new THREE.CatmullRomCurve3(points);
    const trunkGeo = new THREE.TubeGeometry(curve, cfg.trunkTubular, baseRadius, cfg.trunkRadial, false);

    // Сужение к вершине и расширение у корней
    const tPos = trunkGeo.attributes.position;
    const v = new THREE.Vector3();
    for (let i = 0; i < tPos.count; i++) {
        v.fromBufferAttribute(tPos, i);
        const hRatio = THREE.MathUtils.clamp(v.y / height, 0, 1);
        const center = curve.getPoint(hRatio);
        const flare = hRatio < 0.12 ? 1 + Math.pow((0.12 - hRatio) / 0.12, 2) * 0.85 : 1;
        const taper = (1 - hRatio * 0.68) * flare;

        v.x = center.x + (v.x - center.x) * taper;
        v.z = center.z + (v.z - center.z) * taper;
        tPos.setXYZ(i, v.x, v.y, v.z);
    }
    trunkGeo.computeVertexNormals();

    const woodParts = [trunkGeo];
    const leafParts = [];

    // Ветви и крона
    const branchCount = cfg.branchMin + Math.floor(rand() * cfg.branchRange);
    for (let b = 0; b < branchCount; b++) {
        const startT = 0.58 + (b / branchCount) * 0.35;
        const startPt = curve.getPoint(startT);
        const angle = (b / branchCount) * Math.PI * 2 + rand();
        const bLen = height * (0.22 + rand() * 0.16);

        const bEnd = new THREE.Vector3(
            startPt.x + Math.cos(angle) * bLen,
            startPt.y + bLen * 0.85,
            startPt.z + Math.sin(angle) * bLen
        );
        const bMid = startPt.clone().lerp(bEnd, 0.5);
        bMid.y += bLen * 0.1;

        const bCurve = new THREE.CatmullRomCurve3([startPt, bMid, bEnd]);
        woodParts.push(new THREE.TubeGeometry(bCurve, cfg.branchTubular, baseRadius * 0.28, cfg.branchRadial, false));

        // Крона: одна доля-«линза» на конце ветви — как в temp/forest.html
        const leafR = height * FOLIAGE_RADIUS_OF_HEIGHT;
        leafParts.push(createFoliageLobe(leafR, rand, bEnd.x, bEnd.y, bEnd.z));
    }

    return {
        wood: mergeTreeParts(woodParts),
        leaves: mergeTreeParts(leafParts),
        height
    };
}

const hfParams = {
    mid:      (FOG_MIN_M + FOG_MAX_M) / 2,
    range:    (FOG_MAX_M - FOG_MIN_M) / 2,
    strength: FOG_DENSITY
};

// Туман сцены three.js накладывает уже после tonemapping и в выходном (sRGB) пространстве,
// а высотный туман дописывается после него — поэтому его цвет переводим туда же,
// иначе он выглядел бы темнее общей дымки.
const HFOG_COLOR_OUTPUT = scene.fog.color.clone().convertLinearToSRGB();

function applyHeightFog(material) {
    if (!material) return;
    material.onBeforeCompile = (shader) => {
        shader.uniforms.uFogMid      = { value: hfParams.mid };
        shader.uniforms.uFogRange    = { value: hfParams.range };
        shader.uniforms.uFogStrength = { value: hfParams.strength };
        shader.uniforms.uHFogColor   = { value: HFOG_COLOR_OUTPUT };

        shader.vertexShader = shader.vertexShader.replace(
            '#include <common>',
            '#include <common>\nvarying float vWorldY;'
        );
        shader.vertexShader = shader.vertexShader.replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
            #ifdef USE_INSTANCING
                vWorldY = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).y;
            #else
                vWorldY = (modelMatrix * vec4(transformed, 1.0)).y;
            #endif`
        );

        shader.fragmentShader = shader.fragmentShader.replace(
            '#include <common>',
            `#include <common>
            varying float vWorldY;
            uniform float uFogMid;
            uniform float uFogRange;
            uniform float uFogStrength;
            uniform vec3 uHFogColor;`
        );
        shader.fragmentShader = shader.fragmentShader.replace(
            '#include <fog_fragment>',
            `#include <fog_fragment>
            {
                float hfDist = abs(vWorldY - uFogMid);
                float hf = 1.0 - smoothstep(0.0, uFogRange, hfDist);
                hf *= hf;
                gl_FragColor.rgb = mix(gl_FragColor.rgb, uHFogColor, hf * uFogStrength);
            }`
        );
    };
    material.needsUpdate = true;
}

// Проверка: не попадает ли дерево в зону перед входом в штольню (радиус 12 м)
function isNearAdit(x, z, minDistance = 12.0) {
    const minDistSq = minDistance * minDistance;
    for (let i = 0; i < allAditPoints.length; i++) {
        const dx = x - allAditPoints[i].x;
        const dz = z - allAditPoints[i].z;
        if (dx * dx + dz * dz < minDistSq) {
            return true;
        }
    }
    return false;
}

// Вычисляет угол вниз по склону в заданной точке
function getDownhillAngle(x, z, fallbackAngle = 0) {
    const delta = 2.0; // Шаг для вычисления градиента
    const hL = getActualTerrainHeight(x - delta, z);
    const hR = getActualTerrainHeight(x + delta, z);
    const hD = getActualTerrainHeight(x, z - delta);
    const hU = getActualTerrainHeight(x, z + delta);

    const gradX = hR - hL;
    const gradZ = hU - hD;

    // Если склон слишком пологий (например, на плато), используем угол из редактора
    if (Math.abs(gradX) < 0.05 && Math.abs(gradZ) < 0.05) {
        return fallbackAngle;
    }

    // Вектор, направленный вниз по склону (противоположен градиенту)
    const dirX = -gradX;
    const dirZ = -gradZ;

    return Math.atan2(dirZ, dirX);
}

function createAdit(x, y, z, editorAngle, label = 'ШТОЛЬНЯ', url = MINE_PAGE_URL) {
    // Вычисляем угол так, чтобы вход смотрел вниз по склону (от горы)
    const slopeAngle = getDownhillAngle(x, z, editorAngle);

    const group = new THREE.Group();
    group.position.set(x, y, z);
    group.lookAt(
        x + Math.cos(slopeAngle),
        y,
        z + Math.sin(slopeAngle)
    );

    const interior = new THREE.Mesh(interiorGeo, darkInteriorMat);
    interior.position.set(0, 2, -4); // Задняя часть уходит в гору (вверх по склону)
    group.add(interior);

    const leftPillar = new THREE.Mesh(pillarGeo, concreteMat);
    leftPillar.position.set(-3, 2, 0);
    leftPillar.castShadow = true; leftPillar.receiveShadow = true;
    group.add(leftPillar);

    const rightPillar = new THREE.Mesh(pillarGeo, concreteMat);
    rightPillar.position.set(3, 2, 0);
    rightPillar.castShadow = true; rightPillar.receiveShadow = true;
    group.add(rightPillar);

    const lintel = new THREE.Mesh(lintelGeo, concreteMat);
    lintel.position.set(0, 4.9, 0);
    lintel.castShadow = true;
    group.add(lintel);

    const door = new THREE.Mesh(doorGeo, rustyDoorMat);
    door.position.set(1.5, 2, 0.5);
    door.rotation.y = -0.4;
    door.castShadow = true;
    group.add(door);

    const sign = new THREE.Mesh(signGeo, new THREE.MeshBasicMaterial({ map: createSignTexture(label) }));
    sign.position.set(0, 4.5, 1.55);
    group.add(sign);

    const radSign = new THREE.Mesh(radGeo, new THREE.MeshBasicMaterial({ map: radiationTex }));
    radSign.position.set(0.3, 2.5, 0.8);
    radSign.rotation.y = 0.2;
    group.add(radSign);

    const hitbox = new THREE.Mesh(radHitboxGeo, new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide }));
    hitbox.position.copy(radSign.position);
    hitbox.rotation.copy(radSign.rotation);
    hitbox.position.z -= 0.02;
    hitbox.userData.url = url;
    hitbox.userData.aditInfo = { isMain: true, label, x, y, z, angle: editorAngle, url };
    group.add(hitbox);

    aditHitboxes.push(hitbox);
    allMineGroups.push(group);
    scene.add(group);

    radZones.push({
        x: x + Math.cos(editorAngle) * 5,
        z: z + Math.sin(editorAngle) * 5,
        radius: 40
    });

    return group;
}

const allRoadPoints = []; // Здесь будут храниться все точки дорог в 3D-координатах

// Пространственная сетка по дороге: вместо перебора ~6000 точек на каждое дерево
// проверяем только точки в соседних ячейках. Размер ячейки равен радиусу поиска,
// поэтому точки в радиусе всегда попадают в 3x3 вокруг запроса — результат тот же.
let roadGrid = null;
let roadGridCell = 0;

function roadCellKey(ix, iz) {
    return (ix + 32768) * 65536 + (iz + 32768);
}

function buildRoadGrid(minDistance = 6.5) {
    roadGridCell = minDistance;
    roadGrid = new Map();
    for (let i = 0; i < allRoadPoints.length; i++) {
        const p = allRoadPoints[i];
        const key = roadCellKey(Math.floor(p.x / roadGridCell), Math.floor(p.z / roadGridCell));
        let bucket = roadGrid.get(key);
        if (!bucket) {
            bucket = [];
            roadGrid.set(key, bucket);
        }
        bucket.push(p);
    }
}

// Проверка: не слишком ли близко точка (x, z) к дороге
function isNearRoad(x, z, minDistance = 6.5) {
    const minDistSq = minDistance * minDistance;
    if (roadGrid && minDistance <= roadGridCell) {
        const ix = Math.floor(x / roadGridCell);
        const iz = Math.floor(z / roadGridCell);
        for (let ox = -1; ox <= 1; ox++) {
            for (let oz = -1; oz <= 1; oz++) {
                const bucket = roadGrid.get(roadCellKey(ix + ox, iz + oz));
                if (!bucket) continue;
                for (let i = 0; i < bucket.length; i++) {
                    const dx = x - bucket[i].x;
                    const dz = z - bucket[i].z;
                    if (dx * dx + dz * dz < minDistSq) {
                        return true;
                    }
                }
            }
        }
        return false;
    }
    for (let i = 0; i < allRoadPoints.length; i++) {
        const dx = x - allRoadPoints[i].x;
        const dz = z - allRoadPoints[i].z;
        if (dx * dx + dz * dz < minDistSq) {
            return true;
        }
    }
    return false;
}

// Вспомогательная функция: рисуем процедурную текстуру горной дороги с мягкими краями
function createRoadTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 256;
    const ctx = canvas.getContext('2d');

    // Базовый цвет старого асфальта / горного щебня
    ctx.fillStyle = '#5a5650';
    ctx.fillRect(0, 0, 256, 256);

    // Добавляем зернистость (мелкие камни, пыль, трещины)
    for (let i = 0; i < 6000; i++) {
        const x = Math.random() * 256;
        const y = Math.random() * 256;
        const shade = 65 + Math.floor(Math.random() * 55);
        ctx.fillStyle = `rgb(${shade}, ${shade - 3}, ${shade - 8})`;
        ctx.fillRect(x, y, 2, 2);
    }

    // Лёгкая тёмная колея от колёс
    const trackGrad = ctx.createLinearGradient(0, 0, 256, 0);
    trackGrad.addColorStop(0.00, 'rgba(35, 32, 28, 0.0)');
    trackGrad.addColorStop(0.28, 'rgba(35, 32, 28, 0.28)');
    trackGrad.addColorStop(0.50, 'rgba(85, 80, 72, 0.15)'); // середина чуть светлее
    trackGrad.addColorStop(0.72, 'rgba(35, 32, 28, 0.28)');
    trackGrad.addColorStop(1.00, 'rgba(35, 32, 28, 0.0)');
    ctx.fillStyle = trackGrad;
    ctx.fillRect(0, 0, 256, 256);

    // Плавное растворение краёв дороги в землю (обочина)
    ctx.globalCompositeOperation = 'destination-in';
    const edgeGrad = ctx.createLinearGradient(0, 0, 256, 0);
    edgeGrad.addColorStop(0.00, 'rgba(0,0,0,0)');
    edgeGrad.addColorStop(0.14, 'rgba(0,0,0,1)');
    edgeGrad.addColorStop(0.86, 'rgba(0,0,0,1)');
    edgeGrad.addColorStop(1.00, 'rgba(0,0,0,0)');
    ctx.fillStyle = edgeGrad;
    ctx.fillRect(0, 0, 256, 256);

    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.ClampToEdgeWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = 4;
    return tex;
}

const sharedRoadTexture = createRoadTexture();

function buildRoad(points2D, mapSize) {
    if (!points2D || points2D.length < 2) return;

    const ROAD_WIDTH = 9;
    const SKIRT_WIDTH = 6;  // Ширина бокового откоса насыпи
    const SKIRT_DEPTH = 7;  // На сколько метров вниз край насыпи уходит в гору

    const rawPts = points2D.map(p => {
        const wx = (p.x / mapSize - 0.5) * TERRAIN_SIZE_M;
        const wz = (p.y / mapSize - 0.5) * TERRAIN_SIZE_M;
        return new THREE.Vector3(wx, 0, wz);
    });

    const curve = new THREE.CatmullRomCurve3(rawPts, false, 'centripetal', 0.5);
    const totalLength = curve.getLength();
    const divisions = Math.max(10, Math.floor(totalLength / 2.5));
    const smoothPts = curve.getSpacedPoints(divisions);
    if (smoothPts.length < 2) return;

    const vertices = [];
    const uvs = [];
    const indices = [];

    let distAccum = 0;

    for (let i = 0; i < smoothPts.length; i++) {
        const current = smoothPts[i];
        if (i > 0) distAccum += current.distanceTo(smoothPts[i - 1]);

        const dir = new THREE.Vector3();
        if (i === 0) {
            dir.subVectors(smoothPts[i + 1], smoothPts[i]);
        } else if (i === smoothPts.length - 1) {
            dir.subVectors(smoothPts[i], smoothPts[i - 1]);
        } else {
            dir.subVectors(smoothPts[i + 1], smoothPts[i - 1]);
        }

        dir.y = 0;
        if (dir.lengthSq() < 1e-8) {
            dir.set(1, 0, 0);
        } else {
            dir.normalize();
        }

        const widthMod = 1.0 + Math.sin(distAccum * 0.05) * 0.12;
        const halfW = (ROAD_WIDTH * widthMod) / 2;
        const outerW = halfW + SKIRT_WIDTH;

        const norm = new THREE.Vector3(-dir.z, 0, dir.x);
        const centerY = getActualTerrainHeight(current.x, current.z) + 0.15;

        // Сохраняем координаты дороги вместе с её реальной высотой для физики игрока и террасы
        allRoadPoints.push({ x: current.x, y: centerY, z: current.z });

        // 4 точки поперечного сечения (трапеция насыпи):
        const lOutX = current.x + norm.x * outerW;
        const lOutZ = current.z + norm.z * outerW;
        const rawLOutY = getActualTerrainHeight(lOutX, lOutZ);
        const lOutY = Math.min(centerY - 1.5, Number.isFinite(rawLOutY) ? rawLOutY : centerY) - SKIRT_DEPTH;

        const lInX = current.x + norm.x * halfW;
        const lInZ = current.z + norm.z * halfW;

        const rInX = current.x - norm.x * halfW;
        const rInZ = current.z - norm.z * halfW;

        const rOutX = current.x - norm.x * outerW;
        const rOutZ = current.z - norm.z * outerW;
        const rawROutY = getActualTerrainHeight(rOutX, rOutZ);
        const rOutY = Math.min(centerY - 1.5, Number.isFinite(rawROutY) ? rawROutY : centerY) - SKIRT_DEPTH;

        vertices.push(
            lOutX, lOutY,   lOutZ,
            lInX,  centerY, lInZ,
            rInX,  centerY, rInZ,
            rOutX, rOutY,   rOutZ
        );

        const vCoord = distAccum / ROAD_WIDTH;
        uvs.push(
            0.0,  vCoord,
            0.12, vCoord,
            0.88, vCoord,
            1.0,  vCoord
        );

        if (i < smoothPts.length - 1) {
            const v = i * 4;
            indices.push(v, v + 1, v + 4,     v + 1, v + 5, v + 4);
            indices.push(v + 1, v + 2, v + 5, v + 2, v + 6, v + 5);
            indices.push(v + 2, v + 3, v + 6, v + 3, v + 7, v + 6);
        }
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    geo.computeVertexNormals();

    const mat = new THREE.MeshStandardMaterial({
        map: sharedRoadTexture,
        transparent: true,
        depthWrite: true,
        alphaTest: 0.05,
        roughness: 0.95,
        metalness: 0.0,
        side: THREE.DoubleSide,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        polygonOffsetUnits: -2
    });

    const roadMesh = new THREE.Mesh(geo, mat);
    roadMesh.receiveShadow = true;
    roadMesh.castShadow = true;
    scene.add(roadMesh);

    applyHeightFog(mat);
}


const TERRACE_FLAT_R  = 18.0; // Ширина ровной полки под дорогой
const TERRACE_BLEND_R = 45.0; // Ширина плавного откоса
let isTerraceReady = false;

// Перехватываем getActualTerrainHeight, чтобы игрок не проваливался в насыпь и террасу
const _baseTerrainHeight = getActualTerrainHeight;
getActualTerrainHeight = function(wx, wz) {
    const rawY = _baseTerrainHeight(wx, wz);
    if (!isTerraceReady || allRoadPoints.length < 2) return rawY;

    let minDistSq = Infinity;
    let roadY = rawY;

    // Проходим по отрезкам между соседними точками дороги для плавного уклона без ступенек
    for (let i = 0; i < allRoadPoints.length - 1; i++) {
        const p1 = allRoadPoints[i];
        const p2 = allRoadPoints[i + 1];

        const segX = p2.x - p1.x;
        const segZ = p2.z - p1.z;
        const segLenSq = segX * segX + segZ * segZ;

        // Пропускаем разрыв, если на карте несколько отдельных дорог (шаг точек ~2.5 м)
        if (segLenSq > 100 || segLenSq < 1e-6) continue;

        // Проекция точки (wx, wz) на отрезок [p1, p2], t от 0 до 1
        let t = ((wx - p1.x) * segX + (wz - p1.z) * segZ) / segLenSq;
        if (t < 0) t = 0;
        else if (t > 1) t = 1;

        const projX = p1.x + t * segX;
        const projZ = p1.z + t * segZ;

        const dx = wx - projX;
        const dz = wz - projZ;
        const dSq = dx * dx + dz * dz;

        if (dSq < minDistSq) {
            minDistSq = dSq;
            // Плавно вычисляем высоту между началом и концом отрезка
            roadY = p1.y + t * (p2.y - p1.y);
        }
    }

    const blendSq = TERRACE_BLEND_R * TERRACE_BLEND_R;
    if (minDistSq >= blendSq) return rawY;

    const dist = Math.sqrt(minDistSq);
    const groundTerraceY = roadY - 0.15;

    // 1. Проезжая часть (до 4.5 м от оси дороги)
    if (dist <= 4.5) {
        return roadY;
    }
    // 2. Обочина и насыпь (от 4.5 до 18 м)
    if (dist <= TERRACE_FLAT_R) {
        const t = (dist - 4.5) / (TERRACE_FLAT_R - 4.5);
        return THREE.MathUtils.lerp(roadY, groundTerraceY, t);
    }
    // 3. Боковой откос (от 18 до 45 м)
    const t = (dist - TERRACE_FLAT_R) / (TERRACE_BLEND_R - TERRACE_FLAT_R);
    const smoothT = t * t * (3 - 2 * t);
    return THREE.MathUtils.lerp(groundTerraceY, rawY, smoothT);
};


// выравнивание склона под дорогой
function carveRoadTerraces(explicitMesh) {
    try {
        if (allRoadPoints.length === 0) return;

        let targetMesh = explicitMesh;
        if (!targetMesh && typeof scene !== 'undefined') {
            let maxVerts = 0;
            scene.traverse(obj => {
                if (obj.isMesh && !obj.isInstancedMesh && obj.geometry && obj.geometry.attributes.position) {
                    const count = obj.geometry.attributes.position.count;
                    if (count > maxVerts && count > 1000) {
                        maxVerts = count;
                        targetMesh = obj;
                    }
                }
            });
        }

        if (!targetMesh) return;
        targetMesh.updateMatrixWorld(true);

        const pos = targetMesh.geometry.attributes.position;
        const blendSq = TERRACE_BLEND_R * TERRACE_BLEND_R;
        const v = new THREE.Vector3();

        for (let i = 0; i < pos.count; i++) {
            v.fromBufferAttribute(pos, i);
            targetMesh.localToWorld(v);

            let minDistSq = Infinity;
            let targetY = v.y;

            for (let j = 0; j < allRoadPoints.length; j++) {
                const rp = allRoadPoints[j];
                const dx = v.x - rp.x;
                const dz = v.z - rp.z;
                const dSq = dx * dx + dz * dz;

                if (dSq < minDistSq) {
                    minDistSq = dSq;
                    targetY = rp.y - 0.15;
                }
            }

            if (minDistSq < blendSq) {
                const dist = Math.sqrt(minDistSq);
                let newWorldY;

                if (dist <= TERRACE_FLAT_R) {
                    newWorldY = targetY;
                } else {
                    const t = (dist - TERRACE_FLAT_R) / (TERRACE_BLEND_R - TERRACE_FLAT_R);
                    const smoothT = t * t * (3 - 2 * t);
                    newWorldY = THREE.MathUtils.lerp(targetY, v.y, smoothT);
                }

                v.y = newWorldY;
                targetMesh.worldToLocal(v);
                pos.setXYZ(i, v.x, v.y, v.z);
            }
        }

        pos.needsUpdate = true;
        targetMesh.geometry.computeVertexNormals();
        targetMesh.geometry.computeBoundingSphere();

        // Включаем учёт террасы для физики игрока
        isTerraceReady = true;
    } catch (err) {
        console.error('[Road] Ошибка при выравнивании террасы:', err);
    }
}



// ============================================================
// 8. ЗАГРУЗКА ОБЪЕКТОВ
// ============================================================
// ============================================================
// 7b. ЛЕС ИЗ МАСКИ (деревья генерируются на месте)
// ============================================================

// Детерминированный PRNG, чтобы карта леса была одинаковой при каждой загрузке
function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

// Битый битсет маски леса -> точки в координатах карты (центры ячеек)
function decodeForestCells(fd, mapSize) {
    const cols = fd.cols || Math.ceil((fd.mapSize || mapSize) / (fd.cell || 1));
    const rows = fd.rows || cols;
    const bin = atob(fd.cells);
    const stepX = mapSize / cols;
    const stepY = mapSize / rows;
    const points = [];
    for (let i = 0; i < cols * rows; i++) {
        if ((bin.charCodeAt(i >> 3) >> (i & 7)) & 1) {
            const cx = i % cols;
            const cy = (i - cx) / cols;
            points.push({ x: (cx + 0.5) * stepX, y: (cy + 0.5) * stepY });
        }
    }
    return points;
}

// ============================================================
// ПРОРИСОВКА ЛЕСА В РАДИУСЕ ОТ ИГРОКА
// ============================================================
// Деревья разложены по корзинам 500×500 м, поэтому видимый набор
// пересобирается за миллисекунды и только при смещении камеры.
const FOREST_CELL_SIZE_M    = 500;
const FOREST_CELL_COLS      = Math.max(1, Math.ceil(TERRAIN_SIZE_M / FOREST_CELL_SIZE_M));
const FOREST_CELL_ROWS      = FOREST_CELL_COLS;
const FOREST_REBUILD_STEP_M = 150; // через сколько метров пути пересобрать видимый набор

// Радиус прорисовки леса: деревья дальше него не отправляются на GPU.
// 4000 м подобрано замерами: на всех проверенных точках обзора кадр совпадает
// с полным лесом пиксель в пиксель, а треугольников в кадре на 20–60 % меньше.
// Infinity — рисовать весь лес (поведение без оптимизации).
let forestDrawRadiusM = 4000;

const forestState = {
    built: false,
    appliedRadius: Infinity,
    lastX: NaN, lastZ: NaN,
    variants: [],        // [{ wood: InstancedMesh, leaves: InstancedMesh }]
    bushes: null,        // InstancedMesh | null
    total: 0,
    matrices: null,      // Float32Array total*16 — матрица дерева
    colors: null,        // Float32Array total*3  — цвет листвы
    variantOf: null,     // Int32Array total      — индекс варианта
    bushMatrices: null,  // Float32Array total*16 — для деревьев с подлеском
    bushOf: null,        // Uint8Array total
    cellStart: null,
    cellList: null
};

function forestCellOf(x, z) {
    const cx = Math.min(FOREST_CELL_COLS - 1, Math.max(0, Math.floor((x + HALF_WORLD_M) / FOREST_CELL_SIZE_M)));
    const cz = Math.min(FOREST_CELL_ROWS - 1, Math.max(0, Math.floor((z + HALF_WORLD_M) / FOREST_CELL_SIZE_M)));
    return cz * FOREST_CELL_COLS + cx;
}

// Перезаписывает инстанс-буферы леса деревьями в радиусе forestDrawRadiusM
function rebuildForestInstances(camX, camZ) {
    const s = forestState;
    if (!s.built) return;

    const variantCount = s.variants.length;
    const counts = new Int32Array(variantCount);
    let bushCount = 0;

    const woodArrays = s.variants.map(v => v.wood.instanceMatrix.array);
    const leafArrays = s.variants.map(v => v.leaves.instanceMatrix.array);
    const leafColorArrays = s.variants.map(v => v.leaves.instanceColor.array);
    const bushArray = s.bushes ? s.bushes.instanceMatrix.array : null;

    function copyTree(i) {
        const variant = s.variantOf[i];
        const src = i * 16;
        const dst = counts[variant] * 16;

        const woodArr = woodArrays[variant];
        const leafArr = leafArrays[variant];
        for (let j = 0; j < 16; j++) {
            woodArr[dst + j] = s.matrices[src + j];
            leafArr[dst + j] = s.matrices[src + j];
        }

        const leafCol = leafColorArrays[variant];
        const sc = i * 3;
        const dc = counts[variant] * 3;
        leafCol[dc]     = s.colors[sc];
        leafCol[dc + 1] = s.colors[sc + 1];
        leafCol[dc + 2] = s.colors[sc + 2];

        counts[variant]++;

        if (bushArray && s.bushOf[i]) {
            const bdst = bushCount * 16;
            for (let j = 0; j < 16; j++) bushArray[bdst + j] = s.bushMatrices[src + j];
            bushCount++;
        }
    }

    if (forestDrawRadiusM === Infinity) {
        for (let i = 0; i < s.total; i++) copyTree(i);
    } else {
        const radius = forestDrawRadiusM;
        const radiusSq = radius * radius;
        const cells = FOREST_CELL_COLS * FOREST_CELL_ROWS;
        const cellReachSq = (radius + FOREST_CELL_SIZE_M) * (radius + FOREST_CELL_SIZE_M);

        for (let c = 0; c < cells; c++) {
            const p0 = s.cellStart[c], p1 = s.cellStart[c + 1];
            if (p0 === p1) continue;

            const cellX = (c % FOREST_CELL_COLS + 0.5) * FOREST_CELL_SIZE_M - HALF_WORLD_M;
            const cellZ = (Math.floor(c / FOREST_CELL_COLS) + 0.5) * FOREST_CELL_SIZE_M - HALF_WORLD_M;
            const cdx = camX - cellX, cdz = camZ - cellZ;
            if (cdx * cdx + cdz * cdz > cellReachSq) continue;

            for (let k = p0; k < p1; k++) {
                const i = s.cellList[k];
                const src = i * 16;
                const dx = camX - s.matrices[src + 12];
                const dz = camZ - s.matrices[src + 14];
                if (dx * dx + dz * dz > radiusSq) continue;
                copyTree(i);
            }
        }
    }

    for (let v = 0; v < variantCount; v++) {
        const pair = s.variants[v];
        pair.wood.count = counts[v];
        pair.leaves.count = counts[v];
        pair.wood.instanceMatrix.needsUpdate = true;
        pair.leaves.instanceMatrix.needsUpdate = true;
        pair.leaves.instanceColor.needsUpdate = true;
    }

    if (s.bushes) {
        s.bushes.count = bushCount;
        s.bushes.instanceMatrix.needsUpdate = true;
    }

    s.appliedRadius = forestDrawRadiusM;
    s.lastX = camX;
    s.lastZ = camZ;
}

// Раз в кадр: если игрок отошёл от места последней сборки — пересобираем набор
function updateForestDraw() {
    const s = forestState;
    if (!s.built) return;

    if (forestDrawRadiusM !== s.appliedRadius) {
        rebuildForestInstances(camera.position.x, camera.position.z);
        return;
    }
    if (forestDrawRadiusM === Infinity) return;

    const dx = camera.position.x - s.lastX;
    const dz = camera.position.z - s.lastZ;
    if (dx * dx + dz * dz >= FOREST_REBUILD_STEP_M * FOREST_REBUILD_STEP_M) {
        rebuildForestInstances(camera.position.x, camera.position.z);
    }
}

function loadMapObjects() {
    if (!window.MAP_OBJECTS || !Array.isArray(window.MAP_OBJECTS.objects)) {
        console.warn('[Objects] MAP_OBJECTS не найден — только туман и земля');
        createFogClouds();
        finishLoading();
        return;
    }

    const mapSize = window.MAP_OBJECTS.mapSize || 512;
    const objects = window.MAP_OBJECTS.objects;

    const DENSITY_MULTIPLIER = 2; // Плотность леса. 2 - Оптимально для FPS на горе Бештау

    // Источник деревьев: маска леса (новый формат) или старые точки в map_objects.js
    const forestCells = (window.FOREST_DATA && typeof window.FOREST_DATA.cells === 'string')
        ? decodeForestCells(window.FOREST_DATA, mapSize)
        : null;
    const treeSources = forestCells || objects.filter(o => o.type === 'tree');
    const rand = mulberry32(window.FOREST_DATA && window.FOREST_DATA.seed || 31337);

    const maxTrees = Math.max(1, treeSources.length * DENSITY_MULTIPLIER);
    const ruinCount = Math.max(1, objects.filter(o => o.type === 'ruin').length);

    treeMat.color.setHex(0xffffff);

    // Матрицы деревьев собираем в типизированные массивы, а по чанкам раскладываем ниже
    const treeMatrices = new Float32Array(maxTrees * 16);
    const treeColors   = new Float32Array(maxTrees * 3);
    const treeVariant  = new Int32Array(maxTrees);
    const treeCellOf   = new Int32Array(maxTrees);
    const bushMatrices = new Float32Array(maxTrees * 16);
    const bushOf       = new Uint8Array(maxTrees);
    const variantTotals = new Int32Array(TREE_VARIANTS.length);

    const ruins     = new THREE.InstancedMesh(ruinGeo,     ruinMat,  ruinCount);

    const dummy = new THREE.Object3D();
    const color = new THREE.Color();
    const cellMeters = TERRAIN_SIZE_M / mapSize;

    let treeIdx = 0, bushTotal = 0, rIdx = 0;

    // 1. Сначала строим дороги и штольни, запоминаем их координаты
    allRoadPoints.length = 0;
    allAditPoints.length = 0;
    roadGrid = null;

    objects.forEach(obj => {
        const wx = (obj.x / mapSize - 0.5) * TERRAIN_SIZE_M;
        const wz = (obj.y / mapSize - 0.5) * TERRAIN_SIZE_M;

        if (obj.type === 'road') {
            buildRoad(obj.points, mapSize);
        }
        else if (obj.type === 'adit') {
            const wy = getActualTerrainHeight(wx, wz);
            createAdit(wx, wy, wz, obj.aditAngle || 0, obj.label || 'ШТОЛЬНЯ', obj.url || MINE_PAGE_URL);
            allAditPoints.push({ x: wx, z: wz });
        }
    });

    carveRoadTerraces();

    // Сетка по точкам дороги, чтобы быстро отсекать деревья у дороги
    buildRoadGrid(6.5);

    // 2. Деревья из маски леса (или старых точек), обходя дороги и входы в штольни
    const forestStart = performance.now();

    for (let s = 0; s < treeSources.length; s++) {
        const src = treeSources[s];
        const wx = (src.x / mapSize - 0.5) * TERRAIN_SIZE_M;
        const wz = (src.y / mapSize - 0.5) * TERRAIN_SIZE_M;

        const clusterSize = 1 + Math.floor(rand() * DENSITY_MULTIPLIER);

        for (let i = 0; i < clusterSize; i++) {
            const angle = rand() * Math.PI * 2;
            const radius = Math.sqrt(rand()) * cellMeters * 2.5;

            const tx = wx + Math.cos(angle) * radius;
            const tz = wz + Math.sin(angle) * radius;

            // Пропускаем дерево, если оно на дороге (30 м) или у входа в штольню (50 м)
            if (isNearRoad(tx, tz, 30) || isNearAdit(tx, tz, 50.0)) continue;

            const ty = getActualTerrainHeight(tx, tz);

            if (treeIdx >= maxTrees) continue;

            const tiltX = (rand() - 0.5) * 0.05;
            const tiltZ = (rand() - 0.5) * 0.05;
            const rotY  = rand() * Math.PI * 2;

            // У подножия (ниже 500 м) больше взрослых буков, выше — молодняк
            const rv = rand();
            const variant = (ty < 500)
                ? (rv < 0.55 ? 0 : (rv < 0.9 ? 1 : 2))
                : (rv < 0.28 ? 0 : (rv < 0.72 ? 1 : 2));

            const scaleY  = 0.8 + rand() * 0.45;
            const scaleXZ = scaleY * (0.85 + rand() * 0.3);

            dummy.position.set(tx, ty - 0.15, tz);
            dummy.rotation.set(tiltX, rotY, tiltZ);
            dummy.scale.set(scaleXZ, scaleY, scaleXZ);
            dummy.updateMatrix();
            dummy.matrix.toArray(treeMatrices, treeIdx * 16);

            // Цвет листвы с вариациями вокруг базового 0x3b592c из temp/forest.html
            color.setHex(0x3b592c);
            color.offsetHSL((rand() - 0.5) * 0.06, (rand() - 0.5) * 0.18, (rand() - 0.5) * 0.14);
            treeColors[treeIdx * 3]     = color.r;
            treeColors[treeIdx * 3 + 1] = color.g;
            treeColors[treeIdx * 3 + 2] = color.b;

            treeVariant[treeIdx] = variant;
            variantTotals[variant]++;
            treeCellOf[treeIdx] = forestCellOf(tx, tz);

            // Подлесок у части деревьев — как кусты в temp/forest.html
            if (rand() < 0.3) {
                const bs = 0.9 + rand() * 0.7;
                dummy.position.set(
                    tx + (rand() - 0.5) * 1.8,
                    ty + 0.6 * bs,
                    tz + (rand() - 0.5) * 1.8
                );
                dummy.rotation.set(0, rand() * Math.PI * 2, 0);
                dummy.scale.set(bs, bs * 0.65, bs);
                dummy.updateMatrix();
                dummy.matrix.toArray(bushMatrices, treeIdx * 16);
                bushOf[treeIdx] = 1;
                bushTotal++;
            }

            treeIdx++;
        }
    }

    console.log(`[Forest] ${treeSources.length} ячеек → ${treeIdx} деревьев и ${bushTotal} кустов за ${(performance.now() - forestStart).toFixed(1)} мс`);

    // 3. Руины
    objects.forEach(obj => {
        if (obj.type !== 'ruin') return;
        const wx = (obj.x / mapSize - 0.5) * TERRAIN_SIZE_M;
        const wz = (obj.y / mapSize - 0.5) * TERRAIN_SIZE_M;
        const wy = getActualTerrainHeight(wx, wz);
        const sx = 5 + Math.random() * 10;
        const sy = 5 + Math.random() * 10;
        const sz = 5 + Math.random() * 10;
        dummy.position.set(wx, wy + sy / 2 - 0.5, wz);
        dummy.rotation.set(
            (Math.random() - 0.5) * 0.3,
            obj.angle || Math.random() * Math.PI * 2,
            (Math.random() - 0.5) * 0.3
        );
        dummy.scale.set(sx, sy, sz);
        dummy.updateMatrix();
        ruins.setMatrixAt(rIdx, dummy.matrix);
        rIdx++;

        if (Math.random() < 0.3) {
            radZones.push({ x: wx, z: wz, radius: 30 + Math.random() * 30 });
        }
    });

    // 3. Меши леса по вариантам + корзины деревьев для выборки по радиусу
    const forestMeshes = TREE_VARIANTS.map((variantGeo, v) => {
        const count = Math.max(1, variantTotals[v]);

        const wood   = new THREE.InstancedMesh(variantGeo.wood,   trunkMat, count);
        const leaves = new THREE.InstancedMesh(variantGeo.leaves, treeMat,  count);

        wood.castShadow = true;
        wood.receiveShadow = true;
        leaves.castShadow = true;
        leaves.receiveShadow = true;

        // Выделяем буфер инстанс-цветов: значения заполнит rebuildForestInstances
        const white = new THREE.Color(0xffffff);
        for (let i = 0; i < count; i++) leaves.setColorAt(i, white);

        return { wood, leaves };
    });

    const bushes = new THREE.InstancedMesh(bushGeo, bushMat, Math.max(1, bushTotal));
    bushes.castShadow = true;
    bushes.receiveShadow = true;
    bushes.count = 0;

    // Корзины 500 м: стартовые индексы и список деревьев в каждой
    function buildForestCells(indexOf, total) {
        const cellCount = FOREST_CELL_COLS * FOREST_CELL_ROWS;
        const starts = new Int32Array(cellCount + 1);
        for (let i = 0; i < total; i++) starts[indexOf[i] + 1]++;
        for (let c = 0; c < cellCount; c++) starts[c + 1] += starts[c];
        const cursor = starts.slice(0, cellCount);
        const list = new Int32Array(total);
        for (let i = 0; i < total; i++) list[cursor[indexOf[i]]++] = i;
        return { starts, list };
    }

    const treeCells = buildForestCells(treeCellOf, treeIdx);

    forestState.variants = forestMeshes;
    forestState.bushes = bushes;
    forestState.total = treeIdx;
    forestState.matrices = treeMatrices;
    forestState.colors = treeColors;
    forestState.variantOf = treeVariant;
    forestState.bushMatrices = bushMatrices;
    forestState.bushOf = bushOf;
    forestState.cellStart = treeCells.starts;
    forestState.cellList = treeCells.list;
    forestState.appliedRadius = Infinity;
    forestState.lastX = NaN;
    forestState.lastZ = NaN;
    forestState.built = true;

    forestMeshes.forEach(pair => {
        scene.add(pair.wood);
        scene.add(pair.leaves);
    });
    scene.add(bushes);

    // Первичная раскладка видимого набора
    rebuildForestInstances(camera.position.x, camera.position.z);

    ruins.castShadow = true;  ruins.receiveShadow = true;
    scene.add(ruins);

    createFogClouds();
    finishLoading();
}

function finishLoading() {
    const el = document.getElementById('loading');
    if (el) el.style.display = 'none';
}

// ============================================================
// 9. УПРАВЛЕНИЕ
// ============================================================
const controls = new THREE.PointerLockControls(camera, document.body);
const blocker  = document.getElementById('blocker');
const linkRaycaster = new THREE.Raycaster();
const screenCenter  = new THREE.Vector2(0, 0);
const crosshairEl   = document.getElementById('crosshair');
const hintEl        = document.getElementById('hint');

function getAimedSign() {
    if (!controls.isLocked) return null;
    linkRaycaster.setFromCamera(screenCenter, camera);
    const hits = linkRaycaster.intersectObjects(aditHitboxes, false);
    return hits.length > 0 ? hits[0].object : null;
}

function isAimingAtSign() {
    return getAimedSign() !== null;
}

function updateAimFeedback() {
    const aimed = getAimedSign();
    if (aimed) {
        const info = aimed.userData.aditInfo;
        const label = (info && info.label) ? info.label : 'ШТОЛЬНЯ';
        hintEl.textContent = `Нажмите, чтобы войти: ${label}`;
        crosshairEl.style.background = '#00FF00';
        crosshairEl.style.width  = '10px';
        crosshairEl.style.height = '10px';
        hintEl.style.display = 'block';
    } else {
        crosshairEl.style.background = 'white';
        crosshairEl.style.width  = '4px';
        crosshairEl.style.height = '4px';
        hintEl.style.display = 'none';
    }
}

document.addEventListener('mousedown', (event) => {
    if (!controls.isLocked || event.button !== 0) return;
    linkRaycaster.setFromCamera(screenCenter, camera);
    const hits = linkRaycaster.intersectObjects(aditHitboxes, false);
    if (hits.length > 0) {
        const obj = hits[0].object;
        try {
            localStorage.setItem(RETURN_STATE_KEY, JSON.stringify({
                px: camera.position.x, py: camera.position.y, pz: camera.position.z,
                qx: camera.quaternion.x, qy: camera.quaternion.y,
                qz: camera.quaternion.z, qw: camera.quaternion.w,
                adit: obj.userData.aditInfo, t: Date.now()
            }));
        } catch (e) {}
        window.location.href = obj.userData.url || MINE_PAGE_URL;
    }
});

// Аудио
let audioCtx, windFilter, windGain;
function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const bufSize = audioCtx.sampleRate * 2;
    const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

    const src = audioCtx.createBufferSource();
    src.buffer = buffer; src.loop = true;

    windFilter = audioCtx.createBiquadFilter();
    windFilter.type = 'lowpass'; windFilter.frequency.value = 400;

    windGain = audioCtx.createGain(); windGain.gain.value = 0.03;

    src.connect(windFilter);
    windFilter.connect(windGain);
    windGain.connect(audioCtx.destination);
    src.start();

    setInterval(() => {
        if (audioCtx.state === 'suspended') return;
        const now = audioCtx.currentTime;
        windGain.gain.linearRampToValueAtTime(Math.random() * 0.06 + 0.02, now + 3);
        windFilter.frequency.linearRampToValueAtTime(Math.random() * 400 + 150, now + 3);
    }, 4000);
}

function playGeigerClick() {
    if (!audioCtx || audioCtx.state === 'suspended') return;
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(2500 + Math.random() * 1500, audioCtx.currentTime);
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.002);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.02);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.03);
}

document.body.addEventListener('click', (event) => {
    // Клики по панели настроек не должны захватывать указатель
    if (event.target && event.target.closest && event.target.closest('#renderPanel')) return;
    controls.lock();
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
});

controls.addEventListener('lock',   () => blocker.style.display = 'none');
controls.addEventListener('unlock', () => blocker.style.display = 'flex');

// ============================================================
// 10. ФИЗИКА (в метрах)
// ============================================================
const moveState = { forward: false, backward: false, left: false, right: false, jump: false, sprint: false };
const velocity  = new THREE.Vector3();
const direction = new THREE.Vector3();

const PLAYER_HEIGHT = 1.8;
const SAFETY_MARGIN = 0.2;
const WALK_ACCEL    = 200;
const SPRINT_ACCEL  = 800;
const GRAVITY       = 25;
const JUMP_VELOCITY = 20;

document.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT') return; // слайдеры забирают стрелки себе
    switch (e.code) {
        case 'KeyW': moveState.forward  = true; break;
        case 'KeyS': moveState.backward = true; break;
        case 'KeyA': moveState.left     = true; break;
        case 'KeyD': moveState.right    = true; break;
        case 'Space': moveState.jump    = true; e.preventDefault(); break;
        case 'ShiftLeft': case 'ShiftRight': moveState.sprint = true; break;
    }
});
document.addEventListener('keyup', (e) => {
    if (e.target && e.target.tagName === 'INPUT') return;
    switch (e.code) {
        case 'KeyW': moveState.forward  = false; break;
        case 'KeyS': moveState.backward = false; break;
        case 'KeyA': moveState.left     = false; break;
        case 'KeyD': moveState.right    = false; break;
        case 'Space': moveState.jump    = false; break;
        case 'ShiftLeft': case 'ShiftRight': moveState.sprint = false; break;
    }
});

// ============================================================
// 11. СТАРТОВАЯ ПОЗИЦИЯ
// ============================================================
const returnStateRaw = localStorage.getItem(RETURN_STATE_KEY);
let startBlockedByReturn = false;

if (returnStateRaw) {
    try {
        const s = JSON.parse(returnStateRaw);
        if (Date.now() - s.t < 1000 * 60 * 60 * 12) {
            camera.position.set(s.px, s.py, s.pz);
            camera.quaternion.set(s.qx, s.qy, s.qz, s.qw);
            blocker.style.display = 'none';
            startBlockedByReturn = true;
        }
    } catch (e) {}
    localStorage.removeItem(RETURN_STATE_KEY);
}

if (!startBlockedByReturn) {
    if (window.MAP_OBJECTS && window.MAP_OBJECTS.playerStart) {
        const ps = window.MAP_OBJECTS.playerStart;
        const mapSize = window.MAP_OBJECTS.mapSize || 512;

        const wx = (ps.x / mapSize - 0.5) * TERRAIN_SIZE_M;
        const wz = (ps.y / mapSize - 0.5) * TERRAIN_SIZE_M;
        const wy = getActualTerrainHeight(wx, wz) + PLAYER_HEIGHT + SAFETY_MARGIN + 0.5;

        camera.position.set(wx, wy, wz);
        const lookX = wx + Math.cos(ps.angle);
        const lookZ = wz + Math.sin(ps.angle);
        camera.lookAt(lookX, wy, lookZ);

        console.log(`[Start] (${wx.toFixed(0)}, ${wy.toFixed(0)}, ${wz.toFixed(0)}), ${(ps.angle * 180 / Math.PI).toFixed(0)}°`);
    } else {
        const startX = 0;
        const startZ = TERRAIN_SIZE_M * 0.3;
        camera.position.set(
            startX,
            getActualTerrainHeight(startX, startZ) + PLAYER_HEIGHT + SAFETY_MARGIN + 50,
            startZ
        );
        camera.lookAt(0, MAX_HEIGHT_M * 0.6, 0);
        console.log('[Start] Точка старта не задана — южный склон');
    }
}

// ============================================================
// 12. АНИМАЦИЯ
// ============================================================
const raycaster   = new THREE.Raycaster();
const downVector  = new THREE.Vector3(0, -1, 0);
const clock       = new THREE.Clock();
const altitudeDisplay    = document.getElementById('altitude');
const headingDisplay     = document.getElementById('headingDir');
const summitNotification = document.getElementById('summitNotification');

const COMPASS_POINTS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
const compassForward = new THREE.Vector3();

let geigerTimer = 0;
let summitReached = false;

const SUMMIT_RADIUS_M = TERRAIN_SIZE_M * 0.02;
const SUMMIT_HEIGHT_M = MIN_HEIGHT_M + HEIGHT_RANGE_M * 0.9;
const BOUNDARY_M      = HALF_WORLD_M * 0.98;

// Сторона света по горизонтальному направлению взгляда камеры
function updateHeading() {
    camera.getWorldDirection(compassForward);
    compassForward.y = 0; // только горизонтальная составляющая
    if (compassForward.lengthSq() < 1e-6) return;
    compassForward.normalize();
    const deg = Math.atan2(compassForward.x, -compassForward.z) * 180 / Math.PI; // 0° = север (−Z), 90° = восток (+X)
    const idx = Math.round(((deg % 360) + 360) % 360 / 45) % 8;
    headingDisplay.textContent = COMPASS_POINTS[idx];
}

function animate() {
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), 0.1);
    const tNow = clock.elapsedTime;

    updateAimFeedback();
    updateHeading();

    if (controls.isLocked) {
        // Движение
                velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;
        velocity.y -= GRAVITY * delta;

        direction.z = Number(moveState.forward) - Number(moveState.backward);
        direction.x = Number(moveState.right)   - Number(moveState.left);
        direction.normalize();

        let slopeMult = 1.0;
        if (moveState.forward || moveState.backward || moveState.left || moveState.right) {
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            forward.y = 0;

            if (forward.lengthSq() > 1e-6) {
                forward.normalize();
                const rightX = -forward.z;
                const rightZ =  forward.x;

                const worldDirX = forward.x * direction.z + rightX * direction.x;
                const worldDirZ = forward.z * direction.z + rightZ * direction.x;

                slopeMult = getSlopeSpeedMultiplier(worldDirX, worldDirZ);
            }
        }

        const accel = (moveState.sprint ? SPRINT_ACCEL : WALK_ACCEL) * slopeMult;
        if (moveState.forward || moveState.backward) velocity.z -= direction.z * accel * delta;
        if (moveState.left    || moveState.right)    velocity.x -= direction.x * accel * delta;

        controls.moveRight(-velocity.x * delta);
        controls.moveForward(-velocity.z * delta);
        camera.position.y += velocity.y * delta;


        // Мягкие границы мира
        if (Math.abs(camera.position.x) > BOUNDARY_M || Math.abs(camera.position.z) > BOUNDARY_M) {
            camera.position.x = Math.max(-BOUNDARY_M, Math.min(BOUNDARY_M, camera.position.x));
            camera.position.z = Math.max(-BOUNDARY_M, Math.min(BOUNDARY_M, camera.position.z));
        }

        // Проверка земли
        const rayStart = camera.position.clone();
        rayStart.y += 50;
        raycaster.set(rayStart, downVector);

        // ИСПОЛЬЗУЕМ МАКСИМАЛЬНУЮ ВЫСОТУ ИЗ ДВУХ ИСТОЧНИКОВ
        let groundY = Math.max(
            getActualTerrainHeight(camera.position.x, camera.position.z),
            getVisualTerrainHeight(camera.position.x, camera.position.z)
        );

        const hits = raycaster.intersectObjects(allMineGroups, true);
        if (hits.length > 0 && hits[0].point.y > groundY) {
            groundY = hits[0].point.y;
        }

        if (camera.position.y < groundY + PLAYER_HEIGHT + SAFETY_MARGIN) {
            velocity.y = 0;
            camera.position.y = groundY + PLAYER_HEIGHT + SAFETY_MARGIN;
        }

        if (moveState.jump && camera.position.y <= groundY + PLAYER_HEIGHT + SAFETY_MARGIN + 0.2) {
            velocity.y = JUMP_VELOCITY;
        }

        altitudeDisplay.innerText = Math.round(camera.position.y);

        // Вершина
        const horizDist = Math.sqrt(camera.position.x ** 2 + camera.position.z ** 2);
        const onSummit  = horizDist < SUMMIT_RADIUS_M && camera.position.y > SUMMIT_HEIGHT_M;

        if (onSummit && !summitReached) {
            summitReached = true;
            summitNotification.classList.add('show');
        } else if (summitReached && !onSummit && camera.position.y < SUMMIT_HEIGHT_M - 100) {
            summitReached = false;
            summitNotification.classList.remove('show');
        }

        // Гейгер
        let closestDist = Infinity;
        for (const rz of radZones) {
            const dx = camera.position.x - rz.x;
            const dz = camera.position.z - rz.z;
            const d  = Math.sqrt(dx * dx + dz * dz) - rz.radius;
            if (d < closestDist) closestDist = d;
        }

        if (closestDist < 150) {
            const t = Math.max(0, closestDist / 150);
            const baseInterval = 0.1 + t * 1.6;
            geigerTimer -= delta;
            if (geigerTimer <= 0) {
                playGeigerClick();
                geigerTimer = baseInterval * (0.6 + Math.random() * 0.8);
            }
        } else {
            geigerTimer = 0;
        }
    }

    // Дрейф клубов тумана (работает всегда, не только в PointerLock)
    for (const sprite of fogClouds) {
        const u = sprite.userData;
        u.angle += u.speed * delta * 0.15;
        sprite.position.x = Math.cos(u.angle) * u.radius;
        sprite.position.z = Math.sin(u.angle) * u.radius;
        sprite.position.y = u.baseY + Math.sin(tNow * 0.25 + u.phase) * u.bobAmplitude;
    }

    keepCameraAboveGround(1.75); // <-- Гарантирует, что ни один край экрана не уйдёт под склон

    updateForestDraw();

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
// 12.5. ПАНЕЛЬ АТМОСФЕРЫ (как в образце)
// ============================================================
const fogDensityRange = document.getElementById('fogDensityRange');
const fogDensityVal   = document.getElementById('fogDensityVal');
const skyLightRange   = document.getElementById('skyLightRange');
const skyLightVal     = document.getElementById('skyLightVal');

fogDensityRange.addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    scene.fog.density = v;
    fogDensityVal.textContent = v.toFixed(5);
});

skyLightRange.addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    hemiLight.intensity = v;
    dirLight.intensity  = v * 0.85; // солнце держит пропорцию из образца
    skyLightVal.textContent = v.toFixed(2);
});

// ============================================================
// 13. ЗАПУСК
// ============================================================
loadHeightmap();
animate();
</script>
